<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css">
        table { border-collapse: collapse; width: 800px;}
        td { border: 5px solid #000; }
        tr {width: 100px; height: 100px; }
    </style>
    <meta charset="UTF-8">
    <title>Table (task1)</title>
</head>
<body>

        <tr>
            <td colspan="8" bgcolor="aqua"></td>
        </tr>

        <tr>

            <td bgcolor="#8b008b"></td>
            <td rowspan="2" bgcolor="#faebd7"></td>
        </tr>

        <tr>
            <td bgcolor="blue"></td>
            <td bgcolor="#7fff00"></td>
        </tr>

        <tr>
            <td colspan="4" bgcolor="aqua"></td>
        </tr>

        <tr>
            <td colspan="6" bgcolor="aqua"></td>
        </tr>

        <tr>
            <td colspan="8" bgcolor="aqua"></td>
