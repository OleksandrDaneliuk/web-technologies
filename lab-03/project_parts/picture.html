<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css">
        table { border-collapse: collapse; width: 640px;}
        td { border: 5px solid #000; }
        tr { width: 60px; height: 60px;}
    </style>
    <meta charset="UTF-8">
    <title>Picture</title>
</head>
<body>
<table>
    <tr>
        <td colspan="2"></td><!-- перший прямокутник-->
        <td colspan="3"></td> <!-- другий прямокутник -->
        <td colspan="3" bgcolor="yellow"></td><!-- жовтий-->

    </tr>

    <tr>
        <td colspan="1" rowspan="2"></td><!-- перевернутий прямокутник на другому ряді-->
        <td colspan="4" rowspan="4" bgcolor="red"></td><!-- великий квадрад-->
        <td colspan="3" rowspan="2" bgcolor="yellow"></td><!-- жовтий середній-->
    </tr>
    <tr></tr>
    <tr>
        <td colspan="1" rowspan="3"></td><!--довгий зліва -->
        <td rowspan="2"></td><!-- два маленьких-->
        <td rowspan="2"></td><!-- -->
    </tr>
    <tr></tr>
    <tr>
        <td colspan="1" bgcolor="black"></td><!-- чорний під великим-->
        <td colspan="1" bgcolor="black"></td><!-- чорний під великим-->
        <td colspan="2" ></td><!--під великим -->
        <td colspan="3" ></td><!--справа -->

    </tr>

    <tr>
        <td colspan="1" rowspan="3" bgcolor="yellow"></td>
        <td colspan="1" bgcolor="black"></td><!-- чорний під великим-->
        <td colspan="1" bgcolor="black"></td><!-- чорний під великим-->
        <td colspan="2" ></td><!--під великим -->
        <td colspan="3" rowspan="2" bgcolor="blue"></td><!--справа -->
    </tr>

    <tr>
        <td colspan="3" rowspan="2"></td>
        <td colspan="1" bgcolor="black"></td>
    </tr>

    <tr>
        <td colspan="3"></td>
    </tr>
</table>

<a href="../index.html"> Повернутися на головну</a>
</body>
</html>
